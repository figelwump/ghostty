on: [push, pull_request]
name: Nix

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  required:
    name: "Required Checks: Nix"
    if: always()
    runs-on: ${{ github.repository == 'ghostty-org/ghostty' && 'namespace-profile-ghostty-sm' || 'ubuntu-24.04' }}
    needs:
      - check-zig-cache-hash
    steps:
      - if: github.repository == 'figelwump/ghostty'
        name: Require dependency check
        env:
          CHECK_RESULT: ${{ needs.check-zig-cache-hash.result }}
        run: test "$CHECK_RESULT" = success
      - id: status
        name: Determine status
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          if ! grep -q -v -E '(failure|cancelled)' <<< "$results"; then
            result="failed"
          else
            result="success"
          fi
          {
            echo "result=${result}"
            echo "results=${results}"
          } | tee -a "$GITHUB_OUTPUT"
      - if: always() && steps.status.outputs.result != 'success'
        name: Check for failed status
        run: |
          echo "One or more required build workflows failed: ${{ steps.status.outputs.results }}"
          exit 1

  check-zig-cache-hash:
    if: github.repository == 'ghostty-org/ghostty' || github.repository == 'figelwump/ghostty'
    runs-on: ${{ github.repository == 'ghostty-org/ghostty' && 'namespace-profile-ghostty-sm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use writable hosted-runner caches
        if: github.repository == 'figelwump/ghostty'
        run: |
          echo "ZIG_LOCAL_CACHE_DIR=$RUNNER_TEMP/zig-local-cache" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-global-cache" >> "$GITHUB_ENV"
      - name: Setup Cache
        if: github.repository == 'ghostty-org/ghostty'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig
      - name: Setup Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ github.repository == 'ghostty-org/ghostty' && secrets.CACHIX_AUTH_TOKEN || '' }}"
          useDaemon: false # sometimes fails on short jobs
      - name: Check Zig cache
        run: nix develop -c ./nix/build-support/check-zig-cache.sh
